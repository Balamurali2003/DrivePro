<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Shield Base Background -->
  <path d="M50 4 C72 4 88 12 88 28 C88 56 68 82 50 96 C32 82 12 56 12 28 C12 12 28 4 50 4 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        filter="url(#glow)"/>

  <!-- Inner Crest Border -->
  <path d="M50 9 C68 9 82 16 82 30 C82 53 65 76 50 88 C35 76 18 53 18 30 C18 16 32 9 50 9 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.15)" 
        stroke-width="1.5"/>

  <!-- Road Curve Leading Forward -->
  <path d="M43 85 L48 50 L52 50 L57 85 Z" fill="url(#roadGrad)" opacity="0.9" />
  <!-- Road Divider Dashes -->
  <line x1="50" y1="52" x2="50" y2="58" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="64" x2="50" y2="72" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="78" x2="50" y2="84" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Steering Wheel Outer Ring -->
  <circle cx="50" cy="40" r="22" stroke="url(#goldGrad)" stroke-width="3.5" fill="none"/>
  <!-- Steering Wheel Center Hub -->
  <circle cx="50" cy="40" r="7" fill="url(#goldGrad)"/>
  <circle cx="50" cy="40" r="4.5" fill="#0F172A"/>

  <!-- Steering Spokes -->
  <path d="M30 40 L43 40 M57 40 L70 40 M50 47 L50 60" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Top SMK Initials -->
  <text x="50" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SMK</text>
</svg>
